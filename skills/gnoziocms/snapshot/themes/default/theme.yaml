# GnozioCMS default theme manifest.
#
# The admin Theme tab is generated from `settings`, and stored values are checked against it on
# every request: a missing value takes its default and an invalid one falls back to the default.
# Update-safety rules (see docs/theming.md):
#   - add fields and options freely, always with a default;
#   - never rename or remove a field or an option value that sites may have stored;
#   - retire a field by marking it `hidden: true` (it keeps its stored value), not by deleting it.
name: default
label: GnozioCMS Default
version: 1.20.0
description: All-purpose GnozioCMS theme.

menu_locations:
  header:
    label: Header
    default: main
  footer:
    label: Footer
    default: footer
  footer_legal:
    label: Footer bottom links
    default: legal

# Templates editors can choose per page or post (front matter `template:`). "default" means the
# normal template hierarchy. Keep keys stable: content refers to them by name.
page_templates:
  default:
    label: Standard
    description: Title header, then the text and the blocks.
  landing:
    label: Landing
    description: No title header. The page is built from blocks only; start it with a Hero.
  sidebar:
    label: With sidebar
    description: Text beside a sidebar with the page's contents, related pages or entries, and a contact card. Blocks follow below.

# What a content type's single page can be, offered on a card for each type in Admin > Theme > Single Layouts (the cards
# follow the content types the site has). The page layout (a template from page_templates) is chosen there too. Values are
# stored under theme_settings.single_layouts.<type>; a type with no choice yet gets the defaults.
single_layouts:
  label: Single Layouts
  description: How the page of one entry looks, for each content type.
  fields:
    title:
      type: select
      label: Title area
      default: default
      options:
        default: Default
        centered: Centered
        split: Split
        cover: Cover
        minimal: Minimal
    header:
      type: select
      label: Header
      default: site
      options:
        site: Site default
        'on': Over the title
        'off': Solid
    sidebar:
      type: select
      label: Sidebar
      default: none
      options:
        none: None
        right: Right
        left: Left
    image:
      type: toggle
      label: Image
      default: true
    parallax:
      type: toggle
      label: Parallax
      default: false
    excerpt:
      type: toggle
      label: Excerpt
      default: true
    breadcrumbs:
      type: toggle
      label: Breadcrumbs
      default: false
    byline:
      type: toggle
      label: Date and terms
      default: true
    toc:
      type: toggle
      label: Contents
      default: true
    related:
      type: toggle
      label: Related pages
      default: true
    # Other entries of the same type, as small rows with a thumbnail: those sharing a category or a tag, or the newest.
    entries:
      type: select
      label: Related entries
      default: none
      options:
        none: 'Off'
        categories: Same category
        tags: Same tags
        latest: Latest
    entries_max:
      type: select
      label: How many
      default: '4'
      options:
        '3': '3'
        '4': '4'
        '5': '5'
        '6': '6'
    entries_images:
      type: toggle
      label: Thumbnails
      default: true
    card:
      type: toggle
      label: Contact card
      default: true

settings:
  appearance:
    label: Appearance
    description: Colour mode, palette, font pairing, corners and decoration, the starting points of the look.
    columns: 4
    fields:
      mode:
        type: select
        label: Mode
        default: system
        options:
          system: System
          light: Light
          dark: Dark
      palette:
        type: select
        label: Palette
        default: slate
        options:
          slate: Slate
          indigo: Indigo
          emerald: Emerald
          teal: Teal
          rose: Rose
          amber: Amber
          garnet: 'Garnet (deep red on warm paper)'
      font:
        type: select
        label: Font
        default: sans
        options:
          sans: 'Inter'
          display: 'Serif headings, Inter text'
          serif: Serif
          system: 'System fonts (no download)'
      glow:
        type: select
        label: Decoration
        default: soft
        help: The soft coloured glows behind headings and in cards. Solid keeps every surface a flat colour.
        options:
          soft: Soft glows
          solid: Solid colours only
      shape:
        type: select
        label: Corners
        default: soft
        options:
          soft: Soft
          rounded: Rounded
          sharp: Sharp

  header:
    label: Header
    description: Layout and behaviour of the site header.
    columns: 3
    fields:
      layout:
        type: select
        label: Layout
        default: classic
        options:
          classic: 'Classic: logo left, menu right'
          menu_left: 'Menu left: logo and menu together on the left, tools on the right'
          split: 'Split: menu left, logo in the middle, tools right'
          centered: 'Centered: logo in the middle, menu below'
          stacked: 'Stacked: menu in a bar underneath'
          minimal: 'Minimal: logo and a menu button'
          minimal_center: 'Minimal centered: menu button left, logo in the middle'
      shape:
        type: select
        label: Shape
        default: full
        options:
          full: Full width bar
          floating: Floating, detached from the edges
      width:
        type: select
        label: Content width
        default: contained
        options:
          contained: Contained like the page
          wide: Wide, edge to edge
      size:
        type: select
        label: Height
        default: regular
        options:
          regular: Regular
          compact: Compact
          tall: Tall
      border:
        type: select
        label: Edge
        default: line
        options:
          line: A thin line
          none: Nothing
          shadow: A soft shadow
      nav_style:
        type: select
        label: Menu links
        default: soft
        options:
          soft: Soft background on hover
          underline: Underline
          plain: Plain text
      sticky:
        type: select
        label: Sticky
        default: on_scroll
        options:
          on_scroll: Slides in after scrolling
          always: Always at the top
          smart: 'Hides when scrolling down, returns when scrolling up'
          'off': Scrolls away
      shrink:
        type: toggle
        label: Shrinks once the page is scrolled
        help: Works with the header that stays at the top.
        default: false
      row_tone:
        type: select
        label: Header background
        default: default
        help: The row with the logo. A fade goes from the colour down into the page background, so the header melts into the page.
        options:
          default: Page background
          muted: Muted (the soft surface colour)
          soft: Soft tint of the palette colour
          fade-muted: Fades from the muted colour into the page
          fade-soft: Fades from the soft tint into the page
          contrast: Dark
          accent: Palette colour
      search:
        type: select
        label: Search
        default: icon
        options:
          icon: 'An icon that opens the search page'
          field: 'A search box in the header'
          none: 'No search'
      show_language:
        type: toggle
        label: Language switcher
        default: true
      show_mode:
        type: toggle
        label: Dark mode switch
        default: true
      bar_tone:
        type: select
        label: Menu bar background (stacked)
        default: default
        options:
          default: Page background
          muted: Muted
          contrast: Dark
          accent: Palette colour
      transparent:
        type: toggle
        label: Transparent over an opening hero
        help: On pages that start with a Hero block, or a full width Slider, the header sits over it and turns solid on scroll.
        default: false
      mobile_menu:
        type: select
        label: Phone menu
        default: drawer
        help: How the menu opens on small screens. The bottom sheet suits the bottom bar; the full screen suits few, large links.
        options:
          drawer: 'Side drawer from the left'
          drawer_right: 'Side drawer from the right'
          fullscreen: 'Full screen with large links'
          top_sheet: 'Sheet dropping from the top'
          bottom_sheet: 'Sheet rising from the bottom'
      mobile_bar:
        type: toggle
        label: Bottom bar on phones
        help: A bar of icons fixed at the bottom of small screens, with the Menu button and the links below. The menu button leaves the header while it is on.
        default: false
      bar_items:
        type: repeater
        label: Bottom bar links
        item_label: Link
        max: 4
        span: full
        help: The links next to the Menu button in the bottom bar, each with an icon. Leave the list empty for the automatic ones (call, email, and the header button).
        fields:
          icon: { type: icon, label: Icon }
          label: { type: text, label: Label, placeholder: Call us, translatable: true }
          url: { type: link, label: Link, placeholder: 'tel:+302100000000, contact, or /en/contact' }
      topbar_contacts:
        type: toggle
        label: Phone and email in a top bar
        help: Uses the phone and email from the Footer section.
        default: false
      cta_label:
        translatable: true
        type: text
        label: Button text
        default: ''
        placeholder: Get a quote
      cta_url:
        type: link
        label: Button link
        default: ''
        placeholder: contact
      cta_style:
        type: select
        label: Button style
        default: solid
        options:
          solid: Solid
          outline: Outline
      topbar_text:
        translatable: true
        type: text
        label: Top bar message
        default: ''
        placeholder: Free consultation for new projects this month
        span: full
      topbar_url:
        type: link
        label: Top bar message link
        default: ''
        placeholder: contact
      topbar_tone:
        type: select
        label: Top bar background
        default: muted
        options:
          muted: Muted
          contrast: Dark
          accent: Palette colour
      topbar_social:
        type: toggle
        label: Social icons in the top bar
        help: Uses the profiles in Social profiles.
        default: false

  sidebar:
    label: Sidebar card
    description: The card shown in the sidebar of the "With sidebar" layout. Whether a content type has a sidebar, and what it holds, is chosen in Single Layouts.
    columns: 2
    fields:
      toc:
        type: toggle
        label: Show "On this page" contents
        default: true
        hidden: true
      related:
        type: toggle
        label: Show related pages from the main menu
        default: true
        hidden: true
      card_heading:
        type: text
        label: Card heading
        default: ''
        placeholder: Need help?
      card_text:
        type: textarea
        label: Card text
        default: ''
      card_label:
        type: text
        label: Card button text
        default: ''
        placeholder: Contact us
      card_url:
        type: link
        label: Card button link
        default: ''
        placeholder: contact
      card_contacts:
        type: toggle
        label: Show phone and email in the card
        help: Uses the phone and email from the Footer section.
        default: true

  brand:
    label: Brand
    description: The logo, the icons of the site and how it is shown when it is shared.
    columns: 2
    fields:
      logo:
        type: image
        label: Logo
        default: ''
        placeholder: /uploads/media/logo.svg
        help: Replaces the site name in the header. SVG or a wide PNG works best.
      logo_dark:
        type: image
        label: Logo for dark backgrounds
        default: ''
        placeholder: /uploads/media/logo-light.svg
        help: Used in dark mode, in the dark footer and over a dark opening hero. Without it the logo is used everywhere.
      show_name:
        type: toggle
        label: Show the site name next to the logo
        default: false
      logo_height:
        type: number
        blank: true
        min: 16
        max: 160
        label: Logo height
        placeholder: '36'
      logo_height_mobile:
        type: number
        blank: true
        min: 14
        max: 120
        label: Logo on a phone
        placeholder: '36'
        help: Empty is as on a computer.
      footer_logo_height:
        type: number
        blank: true
        min: 16
        max: 200
        label: Logo in the footer
        placeholder: '36'
      name_size:
        type: number
        blank: true
        min: 12
        max: 56
        label: Site name size
        placeholder: '21'
        help: When there is no logo.
      favicon:
        type: image
        label: Favicon
        default: ''
        placeholder: /uploads/media/favicon.svg
        help: The small icon in the browser tab. SVG, PNG or ICO.
      touch_icon:
        type: image
        label: App icon
        default: ''
        placeholder: /uploads/media/app-icon.png
        help: 180×180 pixels PNG, for the home screen of a phone.
      theme_color:
        type: color
        hex: true
        label: Browser colour
        default: ''
        placeholder: '#1e293b'
        help: Colours the address bar of the browser on a phone.
      share_image:
        type: image
        label: Default share image
        default: ''
        placeholder: /uploads/media/share.jpg
        help: 1200×630 pixels is the common size for social previews.

  # The numbers and colours behind the look of the site (the Branding screen). Every field is optional: an empty one leaves the
  # theme's own value, so a site that sets nothing here looks the same as before. Branding.php turns them into CSS.
  design:
    label: Design
    description: Colours, type, spacing, shape and buttons.
    columns: 4
    fields:
      light_accent: {type: color, hex: true, label: Accent, default: ''}
      light_background: {type: color, hex: true, label: Background, default: ''}
      light_surface: {type: color, hex: true, label: Surface, default: ''}
      light_text: {type: color, hex: true, label: Text, default: ''}
      light_muted: {type: color, hex: true, label: Muted text, default: ''}
      light_border: {type: color, hex: true, label: Border, default: ''}
      dark_accent: {type: color, hex: true, label: Accent, default: ''}
      dark_background: {type: color, hex: true, label: Background, default: ''}
      dark_surface: {type: color, hex: true, label: Surface, default: ''}
      dark_text: {type: color, hex: true, label: Text, default: ''}
      dark_muted: {type: color, hex: true, label: Muted text, default: ''}
      dark_border: {type: color, hex: true, label: Border, default: ''}
      light_secondary: {type: color, hex: true, label: Secondary, default: '', help: 'An optional second brand colour, available to blocks as --color-secondary.'}
      dark_secondary: {type: color, hex: true, label: Secondary, default: ''}
      site_palette: {type: text, label: Site palette in use, default: '', help: 'The id of the palette made on this site that is in use. Empty uses the palette chosen under Appearance.'}
      site_palettes: {type: textarea, label: Site palettes, default: '', help: 'The palettes made on this site, as JSON; edited on the Branding screen.'}
      duo_picker: {type: toggle, label: Colour pairings from Duo, default: true, help: 'Lets the palette studio show colour pairs fetched from Duo when it is opened. The public site never contacts Duo.'}
      duo_url: {type: text, label: Address of the colour pairings, default: '', placeholder: 'https://duo.alexpate.com/colors.json'}
      ink:
        type: color
        hex: true
        label: Dark panels and footer
        default: ''
        help: The near-black behind pictures, dark panels and the footer.
      heading_font:
        type: select
        label: Headings
        default: pairing
        options:
          pairing: Follow the font pairing
          inter: Inter
          system: System font
          humanist: Humanist
          geometric: Geometric
          neo_grotesque: Neo-grotesque
          rounded: Rounded
          industrial: Industrial
          classical: Classical humanist
          transitional: Transitional serif
          old_style: Old-style serif
          slab: Slab serif
          didone: Didone serif
          mono: Monospace
          custom: Your own font
      body_font:
        type: select
        label: Text
        default: pairing
        options:
          pairing: Follow the font pairing
          inter: Inter
          system: System font
          humanist: Humanist
          geometric: Geometric
          neo_grotesque: Neo-grotesque
          rounded: Rounded
          industrial: Industrial
          classical: Classical humanist
          transitional: Transitional serif
          old_style: Old-style serif
          slab: Slab serif
          didone: Didone serif
          mono: Monospace
          custom: Your own font
      ui_font:
        type: select
        label: Interface
        default: auto
        help: Menus, buttons, labels, eyebrows, dates and breadcrumbs.
        options:
          auto: Same as the text
          heading: Same as the headings
          inter: Inter
          system: System font
          humanist: Humanist
          geometric: Geometric
          neo_grotesque: Neo-grotesque
          rounded: Rounded
          industrial: Industrial
          classical: Classical humanist
          transitional: Transitional serif
          old_style: Old-style serif
          slab: Slab serif
          didone: Didone serif
          mono: Monospace
          custom: Your own font
      ui_family: {type: text, label: Interface family, default: '', help: 'The family of your own fonts the interface uses when Interface is Your own font.'}
      code_font: {type: select, label: Code, default: auto, options: {auto: System monospace, custom: Your own font}}
      code_family: {type: text, label: Code family, default: '', help: 'The family of your own fonts code uses when Code is Your own font.'}
      numerals: {type: select, label: Numbers, default: auto, options: {auto: Theme, tabular: Same width in tables and dates, oldstyle: Old-style in text}}
      ligatures: {type: select, label: Ligatures, default: auto, options: {auto: Theme, none: 'Off', extra: Extra (where the font has them)}}
      font_file:
        type: url
        label: Font file
        default: ''
        placeholder: fonts/brand.woff2
        help: A WOFF2 file (one variable font with all weights is best). Put it in custom/assets/fonts/ and type fonts/name.woff2, or give a full address.
      heading_family:
        type: text
        label: Heading font family
        default: ''
        help: The family of your own fonts that headings use when Headings is “Your own font”.
      body_family:
        type: text
        label: Text font family
        default: ''
        help: The family of your own fonts that text uses when Text is “Your own font”.
      fonts:
        type: repeater
        label: Your own font files
        item_label: Font file
        max: 48
        span: full
        help: The font files of your own families, each with its weight and style. Managed on the Typography tab (Fonts).
        fields:
          family: {type: text, label: Family, default: ''}
          file: {type: text, label: File in custom/assets, default: ''}
          weight: {type: text, label: Weight, default: '400'}
          style:
            type: select
            label: Style
            default: normal
            options: {normal: Normal, italic: Italic}
          range: {type: text, label: Unicode range, default: ''}
          cover: {type: text, label: Scripts covered, default: ''}
          adjust: {type: text, label: Fallback adjustment, default: ''}
          v: {type: text, label: Version, default: ''}
      base_size:
        type: number
        blank: true
        min: 13
        max: 24
        label: Text size
        placeholder: '16'
        help: Headings follow it.
      line_height:
        type: decimal
        min: 1.1
        max: 2.4
        label: Line height of text
        default: ''
        placeholder: '1.65'
      scale:
        type: select
        label: Heading scale
        default: auto
        options:
          auto: Theme
          '1.125': Major second 1.125
          '1.2': Minor third 1.2
          '1.25': Major third 1.25
          '1.333': Perfect fourth 1.333
          '1.414': Augmented fourth 1.414
          '1.5': Perfect fifth 1.5
          '1.618': Golden ratio 1.618
      heading_weight:
        type: select
        label: Heading weight
        default: auto
        options:
          auto: Theme
          '400': Regular
          '500': Medium
          '600': Semibold
          '700': Bold
          '800': Extra bold
      heading_tracking:
        type: select
        label: Heading letter spacing
        default: auto
        options:
          auto: Theme
          tighter: Tighter
          tight: Tight
          normal: Normal
          wide: Wide
      heading_leading:
        type: select
        label: Heading line height
        default: auto
        options:
          auto: Theme
          tight: Tight
          normal: Normal
          relaxed: Relaxed
      heading_case:
        type: select
        label: Heading case
        default: auto
        options:
          auto: As typed
          uppercase: Capitals
      heading_color:
        type: select
        label: Heading colour
        default: text
        help: Page titles, section titles and the headings of the text. Dark panels, the footer and headings over pictures keep their own colour.
        options:
          text: Same as the text
          accent: The palette colour (the accent)
          custom: Your own colours
      heading_color_light: {type: color, hex: true, label: Headings, default: ''}
      heading_color_dark: {type: color, hex: true, label: Headings, default: ''}
      container:
        type: number
        blank: true
        min: 640
        max: 2400
        label: Content width
        placeholder: '1216'
      reading_width:
        type: number
        blank: true
        min: 480
        max: 1200
        label: Reading width
        placeholder: '736'
        help: Narrow pages and text.
      gutter:
        type: number
        blank: true
        min: 16
        max: 160
        label: Side margin
        placeholder: '40'
        help: A phone keeps 20.
      section_space:
        type: number
        blank: true
        min: 16
        max: 320
        label: Space between sections
        placeholder: '112'
        help: Phones use about half.
      header_height:
        type: number
        blank: true
        min: 40
        max: 200
        label: Header height
        placeholder: '72'
        help: Compact and tall follow it.
      spacing:
        type: select
        label: Spacing
        default: auto
        options:
          auto: Theme
          tight: Tight
          airy: Airy
          roomy: Roomy
      radius:
        type: number
        blank: true
        min: 0
        max: 48
        label: Corner radius
        placeholder: '14'
        help: Empty follows Corners.
      button_radius:
        type: select
        label: Button corners
        default: auto
        options:
          auto: Theme
          pill: Pill
          rounded: Rounded
          square: Square
      shadows:
        type: select
        label: Shadows
        default: auto
        options:
          auto: Theme
          none: None
          soft: Soft
          medium: Medium
          strong: Strong
      button_height:
        type: number
        blank: true
        min: 28
        max: 80
        label: Button height
        placeholder: '46'
      button_pad:
        type: number
        blank: true
        min: 8
        max: 80
        label: Button side padding
        placeholder: '22'
      button_size:
        type: number
        blank: true
        min: 11
        max: 24
        label: Button text size
        placeholder: '15'
      button_weight:
        type: select
        label: Button text weight
        default: auto
        options:
          auto: Theme
          '500': Medium
          '600': Semibold
          '700': Bold
          '800': Extra bold
      button_case:
        type: select
        label: Button text case
        default: auto
        options:
          auto: As typed
          uppercase: Capitals
      button_tracking: {type: select, label: Button letter spacing, default: auto, options: {auto: Theme, tight: Tight, normal: Normal, wide: Wide, wider: Wider}}
      # Links and buttons (BrandingButtons.php). A tone is a palette role or a custom #rrggbb that passes AA; empty keeps the theme's own.
      link_color: {type: tone, label: Link colour, default: ''}
      link_hover: {type: tone, label: Link hover colour, default: ''}
      link_color_dark: {type: tone, label: Link colour, dark, default: ''}
      link_hover_dark: {type: tone, label: Link hover colour, dark, default: ''}
      link_underline:
        type: select
        label: Link underline
        default: auto
        options:
          auto: Theme
          always: Always
          hover: On hover
          never: Never
      link_thickness:
        type: select
        label: Underline thickness
        default: auto
        options:
          auto: Theme
          thin: Thin
          medium: Medium
          thick: Thick
      link_offset:
        type: select
        label: Underline distance
        default: auto
        options:
          auto: Theme
          near: Near
          far: Far
      btn_primary_bg: {type: tone, label: Primary background, default: ''}
      btn_primary_text: {type: tone, label: Primary text, default: ''}
      btn_primary_border: {type: tone, label: Primary border, default: ''}
      btn_primary_hover_bg: {type: tone, label: Primary hover background, default: ''}
      btn_primary_hover_text: {type: tone, label: Primary hover text, default: ''}
      btn_primary_hover_border: {type: tone, label: Primary hover border, default: ''}
      btn_primary_border_width:
        type: select
        label: Primary border width
        default: auto
        options:
          auto: Theme
          '0': None
          '1': 1px
          '2': 2px
          '3': 3px
      btn_primary_radius:
        type: select
        label: Primary corners
        default: auto
        options:
          auto: Inherit
          pill: Pill
          rounded: Rounded
          square: Square
      btn_secondary_bg: {type: tone, label: Secondary background, default: ''}
      btn_secondary_text: {type: tone, label: Secondary text, default: ''}
      btn_secondary_border: {type: tone, label: Secondary border, default: ''}
      btn_secondary_hover_bg: {type: tone, label: Secondary hover background, default: ''}
      btn_secondary_hover_text: {type: tone, label: Secondary hover text, default: ''}
      btn_secondary_hover_border: {type: tone, label: Secondary hover border, default: ''}
      btn_secondary_border_width:
        type: select
        label: Secondary border width
        default: auto
        options:
          auto: Theme
          '0': None
