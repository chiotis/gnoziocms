label: Latest content
description: The newest posts, projects, or any content type, shown from a quiet text list to a magazine layout. Updates by itself when you publish.
category: Showcase
variants:
  cards: Cards
  list: Minimal list
  compact: Compact with thumbnails
  overlay: Image tiles with text on top
  strip: Sliding strip
  featured: Featured story and a list
  magazine: Magazine (large lead story, cards below)
  editorial: Editorial (large alternating rows)
fields:
  eyebrow:
    type: text
    label: Eyebrow
  heading:
    type: text
    label: Heading
  intro:
    type: textarea
    label: Introduction
  source:
    type: select
    label: Show
    default: posts
    options: {}
    options_from: content_types
  term:
    type: text
    searchable: false
    label: Only this category or tag
    placeholder: news
    help: Optional. The slug of a category or tag, as in Taxonomies.
  limit:
    type: number
    label: Number of items
    default: 3
    min: 0
    help: 0 shows all of them.
  order:
    type: select
    label: Order
    default: date_desc
    options:
      date_desc: Newest first
      date_asc: Oldest first
      title_asc: 'Title A–Z'
      title_desc: 'Title Z–A'
      random: 'Random (new each time the page is made)'
  offset:
    type: number
    label: Skip the first
    default: 0
    min: 0
    max: 50
    help: 'Leaves out this many of the first entries in the order above (with Newest first, the newest), for example the ones another block of the page already shows.'
  skip_shown:
    type: toggle
    label: Leave out entries shown above
    default: false
    help: 'Entries that a block higher on the page already shows (or the page itself) are left out, and the next ones take their place.'
  autoplay:
    type: select
    label: Move by itself
    default: 'off'
    options:
      'off': No
      '3': 'Every 3 seconds'
      '5': 'Every 5 seconds'
      '8': 'Every 8 seconds'
      '12': 'Every 12 seconds'
    help: It stops while a visitor points at it or uses it, a pause button is shown, and visitors who prefer reduced motion never get automatic movement.
    when: { variant: strip }
  strip_step:
    type: select
    label: Each move goes
    default: one
    options: { one: One card on, page: A whole view on }
    when: { variant: strip }
  strip_nav:
    type: select
    label: Controls
    default: both
    options: { both: Arrows and dots, arrows: Arrows, dots: Dots, none: None (swipe and keys only) }
    when: { variant: strip }
  columns:
    type: select
    label: Columns (cards and tiles; cards in view for the strip)
    default: '3'
    options: { '2': '2', '3': '3', '4': '4' }
  show_image:
    type: toggle
    label: Show images
    default: true
  show_excerpt:
    type: toggle
    label: Show the excerpt
    default: true
  show_meta:
    type: toggle
    label: Show date and category
    default: true
  link_label:
    type: text
    label: "'View all' text"
  link_url:
    type: link
    label: "'View all' link"
