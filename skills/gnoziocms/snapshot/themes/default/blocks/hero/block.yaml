label: Hero
description: Opening section with a strong heading, supporting text, buttons, and an image or a video behind it. The steps layout adds up to four numbered steps over the image. It can show the newest entry of a content type (a post, a project) instead of typed text. As the first block of a page it becomes the page title (h1).
category: Openers
variants:
  split: Text and image side by side
  centered: Centered text, wide image below
  cover: Text over a full-width image
  cover-centered: Centered text over a full-width image
  steps: Text over a full-width image, with numbered steps
  steps-centered: Centered text over a full-width image, with numbered steps
  minimal: Large heading, no image
# A centred layout is styled as the layout it is a variant of (the section also gets that layout's class).
variant_extends: { cover-centered: cover, steps-centered: steps }
# Version 0.1.86 had a text alignment field for these two layouts; a block that used it becomes the layout it means.
variant_migrations:
  - { when: { variant: cover, align: center }, to: cover-centered, drop: [align] }
  - { when: { variant: steps, align: center }, to: steps-centered, drop: [align] }
fields:
  source:
    type: select
    label: Show
    default: manual
    options: { manual: Text entered here }
    options_from: content_types
    help: 'Or the newest entry of a content type: its title, excerpt and main image, with a button to it.'
  term:
    type: text
    searchable: false
    label: Only this category or tag
    placeholder: news
    help: Optional. The slug of a category or tag, as in Taxonomies.
    when: { source: '!manual' }
  order:
    type: select
    label: Order
    default: date_desc
    options:
      date_desc: Newest first
      date_asc: Oldest first
      title_asc: 'Title A–Z'
      title_desc: 'Title Z–A'
      random: 'Random (new each time the page is made)'
    when: { source: '!manual' }
  offset:
    type: number
    label: Skip the first
    default: 0
    min: 0
    max: 50
    help: 'Leaves out this many of the first entries in the order above (with Newest first, the newest), for example the ones another block of the page already shows.'
    when: { source: '!manual' }
  skip_shown:
    type: toggle
    label: Leave out entries shown above
    default: false
    help: 'Entries that a block higher on the page already shows (or the page itself) are left out, and the next ones take their place.'
    when: { source: '!manual' }
  entry_button:
    type: text
    label: Button text
    placeholder: Read more
    when: { source: '!manual' }
  eyebrow:
    type: text
    label: Eyebrow
    placeholder: Short label above the heading
    help: With an entry, its category when this is empty.
  heading:
    type: text
    label: Heading
    required: true
    when: { source: manual }
  text:
    type: textarea
    label: Text
    when: { source: manual }
  actions:
    type: repeater
    label: Buttons
    item_label: Button
    max: 2
    when: { source: manual }
    fields:
      label: { type: text, label: Label }
      url: { type: link, label: Link, help: 'A page ("contact"), a path ("/en/contact"), a full URL, #anchor, mailto: or tel:' }
      style: { type: select, label: Style, default: primary, options: { primary: Primary, secondary: Secondary, text: Text } }
  highlights:
    type: repeater
    label: Highlights
    item_label: Highlight
    inline: true
    max: 3
    fields:
      text: { type: text, label: Text }
  items:
    type: repeater
    label: Steps
    item_label: Step
    max: 4
    fields:
      title: { type: text, label: Title }
      text: { type: textarea, label: Text }
      link: { type: link, label: Link }
      link_label: { type: text, label: Link text, placeholder: Learn more }
  background:
    type: select
    label: Picture
    default: image
    options:
      image: Image
      video: Video that plays behind the text
    when: { source: manual }
  image:
    type: image
    label: Image
    when: { background: image, source: manual }
  image_alt:
    type: text
    label: Image description
    help: What the image shows, for people who cannot see it. Leave empty if it is purely decorative.
    when: { background: image, source: manual }
  video:
    type: video
    label: Video
    placeholder: https://www.youtube.com/watch?v=…
    help: 'Choose a video from the media library (.mp4 or .webm), or paste a YouTube or Vimeo link, or the address of a video file elsewhere. It plays silently, in a loop, with a pause button. A YouTube or Vimeo video is loaded from them when the page opens.'
    when: { background: video, source: manual }
  video_poster:
    type: image
    label: Still image
    help: Shown while the video loads, when the visitor has asked their device for less motion, and under a video that is paused. Recommended, and it is the share image of the page when it has none.
    when: { background: video, source: manual }
