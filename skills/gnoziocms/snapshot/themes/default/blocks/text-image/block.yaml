label: Text and image
description: Text with an image beside it, above it or below it. Alternate left and right to give long pages a rhythm.
category: Content
variants:
  image-right: Image on the right
  image-left: Image on the left
  image-top: Image above the text
  image-bottom: Image below the text
  story: Story (a large quote, the text, a portrait on the right)
variant_extends: { story: image-right }
fields:
  eyebrow:
    type: text
    label: Eyebrow
  heading:
    type: text
    label: Heading
  pull_quote:
    type: textarea
    label: Quote
    placeholder: «I make each piece the way a lioness brings a lion into the world.»
    help: Large, above the text.
    when: { variant: story }
  body:
    type: markdown
    label: Text
    help: Bullet lists are shown with check marks.
  actions:
    type: repeater
    label: Buttons
    item_label: Button
    max: 2
    fields:
      label: { type: text, label: Label }
      url: { type: link, label: Link }
      style: { type: select, label: Style, default: primary, options: { primary: Primary, secondary: Secondary, text: Text } }
  image:
    type: image
    label: Image
  image_alt:
    type: text
    label: Image description
    help: What the image shows. Leave empty if it is purely decorative.
  image_ratio:
    type: select
    label: Image shape
    default: landscape
    options: { landscape: 'Landscape (4:3)', wide: 'Wide (16:9)', portrait: 'Portrait (4:5)', square: 'Square' }
  dots:
    type: toggle
    label: Five dots before the eyebrow
    default: false
