label: Portfolio
description: A grid of work with filter buttons for the categories. Type the pieces in, or show the entries of a content type (filtered by their categories).
category: Showcase
variants:
  grid: Grid
  overlay: Title over the picture
fields:
  eyebrow:
    type: text
    label: Eyebrow
  heading:
    type: text
    label: Heading
  intro:
    type: textarea
    label: Introduction
  source:
    type: select
    label: Show
    default: manual
    options: { manual: Pieces entered below }
    options_from: content_types
  limit:
    type: number
    label: Number of entries
    default: 12
    min: 1
    max: 24
  order:
    type: select
    label: Order
    default: date_desc
    options:
      date_desc: Newest first
      date_asc: Oldest first
      title_asc: 'Title A–Z'
      title_desc: 'Title Z–A'
      random: 'Random (new each time the page is made)'
    when: { source: '!manual' }
  offset:
    type: number
    label: Skip the first
    default: 0
    min: 0
    max: 50
    help: 'Leaves out this many of the first entries in the order above (with Newest first, the newest), for example the ones another block of the page already shows.'
    when: { source: '!manual' }
  skip_shown:
    type: toggle
    label: Leave out entries shown above
    default: false
    help: 'Entries that a block higher on the page already shows (or the page itself) are left out, and the next ones take their place.'
    when: { source: '!manual' }
  columns:
    type: select
    label: Columns
    default: '3'
    options: { '2': '2', '3': '3', '4': '4' }
  ratio:
    type: select
    label: Picture shape
    default: landscape
    options: { landscape: 'Landscape (4:3)', square: Square, portrait: 'Portrait (4:5)' }
  filters:
    type: toggle
    label: Filter buttons
    default: true
  all_label:
    type: text
    label: "'All' button text"
    placeholder: All
  items:
    type: repeater
    label: Pieces
    item_label: Piece
    max: 48
    fields:
      title: { type: text, label: Title }
      category: { type: text, label: Categories, placeholder: 'Web, Branding', help: 'One or more, separated by commas.' }
      image: { type: image, label: Image }
      text: { type: textarea, label: Short text }
      url: { type: link, label: Link }
