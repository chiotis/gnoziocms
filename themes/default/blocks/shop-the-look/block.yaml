label: Shop the look
description: 'A look: its picture with a point on each piece, the pieces with their prices, the total and Add the look, which puts them all in the cart. On a product''s page, Complete the look lists the other pieces of the product''s look.'
category: Shop
requires: shop
variants:
  split: Picture and pieces side by side
  complete: Complete the look (a short list)
fields:
  tour:
    type: toggle
    label: Show the pieces in turn
    help: Each piece lights up with its note on the picture, then the next, in a loop. It waits while a visitor points at the look, stops once they open a note, and stays still for visitors who ask for less motion.
    default: false
  header_beside:
    type: toggle
    label: The heading beside the picture
    default: false
  total_in_button:
    type: toggle
    label: The total in the button
    default: false
  picture:
    type: toggle
    label: Show the look's picture
    help: Complete the look only; the other layout always has it.
    default: false
    when: { variant: complete }
  add_each:
    type: toggle
    label: An add button for each piece
    default: false
    when: { variant: complete }
  eyebrow:
    type: text
    label: Eyebrow
  heading:
    type: text
    label: Heading
    placeholder: Shop the look
  intro:
    type: textarea
    label: Introduction
  look:
    type: select
    label: Look
    options_from: looks
    help: Empty on a look's own page, or on a product's page for the first look in its Looks (or, with none chosen there, the newest look it is a piece of).
