label: Entry title
description: 'The title area of the entry, as its page draws it today: the title, the excerpt, the main image and a line with its terms. Only in a template built with blocks.'
category: Entry
scope: template
spacing: none
variants:
  auto: As set for the content type
  default: Default
  centered: Centered
  split: Split
  cover: Cover
  minimal: Minimal
fields:
  image:
    type: toggle
    label: Show the main image
    default: true
  excerpt:
    type: toggle
    label: Show the excerpt under the title
    default: true
  byline:
    type: toggle
    label: Show the line with terms, author and date
    default: true
  breadcrumbs:
    type: toggle
    label: Show the trail above the title
    default: false
  trail:
    when: { breadcrumbs: ['1', 'true'] }
    type: text
    label: Trail
    placeholder: '{home} > {type} > {title}'
    help: 'The parts in order, separated by >. {home}, {type} (the content type), {title}, {term:collections} (the entry''s term in that taxonomy, with the terms above it; {term:collections:alone} without them), {taxonomy:collections} (the taxonomy''s name), or text as written; Text|/address gives it a link. Empty: Home > type > title.'
  separator:
    when: { breadcrumbs: ['1', 'true'] }
    type: select
    label: Between the parts
    default: auto
    options:
      auto: Theme (›)
      slash: /
      double: //
      dot: ·
      dash: —
      bar: '|'
