label: Gallery
description: A set of images in a grid, a masonry layout, or a scrolling strip. Images open larger in a viewer.
category: Media
variants:
  grid: Even grid
  masonry: Masonry
  strip: Scrolling strip
fields:
  source:
    type: select
    label: Pictures
    default: manual
    options: { manual: Chosen below, entry: "The entry's gallery" }
    help: "The entry's gallery: the pictures of the page or entry the block is on (in a template, the entry it is drawn for). Shows nothing when it has none."
  field:
    type: text
    label: Gallery field
    placeholder: gallery
    help: The key of the field, for a type with more than one gallery. Empty means its gallery.
    when: { source: [entry] }
  eyebrow:
    type: text
    label: Eyebrow
  heading:
    type: text
    label: Heading
  intro:
    type: textarea
    label: Introduction
  columns:
    type: select
    label: Columns
    default: '3'
    options: { '2': '2', '3': '3', '4': '4' }
  ratio:
    type: select
    label: Image shape (grid)
    default: landscape
    options: { landscape: 'Landscape (4:3)', square: Square, portrait: 'Portrait (4:5)', original: Original }
  lightbox:
    type: toggle
    label: Open images in a viewer
    default: true
  images:
    type: repeater
    label: Images
    item_label: Image
    max: 60
    when: { source: [manual] }
    fields:
      image: { type: image, label: Image }
      alt: { type: text, label: Description, help: What the image shows. Leave empty to use the media library text. }
      caption: { type: text, label: Caption }
