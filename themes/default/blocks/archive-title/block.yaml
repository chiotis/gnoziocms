label: Archive title
description: 'The title area of a list of entries: its title and subtitle (for a category or tag, its name and description), a picture, and the trail. Only in an archive template built with blocks.'
category: Archive
scope: archive
spacing: none
variants:
  auto: As set for the list
  default: Default
  centered: Centered
  split: Split
  cover: Cover
  minimal: Minimal
  chapter: Chapter (a collection's number, title and quote)
fields:
  image:
    type: image
    label: Picture
    help: Optional. Leave empty to use the picture chosen for the list in Archive Layouts (in the Chapter layout, the term's own picture first).
  breadcrumbs:
    type: toggle
    label: Show the trail above the title
    default: false
