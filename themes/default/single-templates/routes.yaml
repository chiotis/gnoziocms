# Starting template for the page of routes when it is "Built with blocks" (Admin > Theme > Single Layouts). Data, not code: blocks in the
# shape they are stored in. A site overrides it with custom/single-templates/routes.yaml. See docs/theming.md, "Starting templates".
# The title area, the facts the page shows (distance, ascent, difficulty...), the text, then the blocks of the route.
# Differs: no map, no download of the track and no "what is near" list.
blocks:
  - { type: entry-title }
  - { type: fact-sheet }
  - { type: content }
  - { type: entry-blocks }
