# Starting template for the list of projects when it is "Built with blocks" (Admin > Theme > Archive Layouts). Data, not code. A site
# overrides it with custom/archive-templates/projects.yaml. See docs/theming.md, "Starting templates".
# The title area, the filters and the list, newest first; each card is the picture (4:3), the title and the excerpt.
blocks:
  - { type: archive-title }
  - { type: filter-bar }
  - { type: result-count }
  - { type: entry-list, variant: grid, columns: '3', per_page: 12, order: date_desc }
card:
  - { type: image, image: { bind: main_image }, ratio: classic }
  - type: text
    heading: { bind: title }
    body: { bind: excerpt }
